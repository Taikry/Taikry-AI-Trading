version: '3.8'

services:
  taikry-app:
    build: .
    container_name: taikry_pro_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://taikry_user:taikry_secure_pass_2026@postgres:5432/taikry_db
      - REDIS_URL=redis://redis:6379/0
      - AUTO_START_MONITORING=true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: taikry_postgres
    restart: always
    environment:
      POSTGRES_USER: taikry_user
      POSTGRES_PASSWORD: taikry_secure_pass_2026
      POSTGRES_DB: taikry_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taikry_user -d taikry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taikry_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
