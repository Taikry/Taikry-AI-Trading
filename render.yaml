services:
  - type: web
    name: taikry-ai-market-intelligence
    runtime: docker
    region: singapore
    plan: free
    numInstances: 1
    healthCheckPath: /ping
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taikry-market-database
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_APP_URL
        fromService:
          name: taikry-ai-market-intelligence
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: taikry-ai-market-intelligence
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTO_START_MONITORING
        value: "true"
      - key: MT5_BRIDGE_TOKEN
        sync: false
      - key: OANDA_API_TOKEN
        sync: false
      - key: OANDA_ACCOUNT_ID
        sync: false
      - key: OANDA_ENV
        value: auto
      - key: SAAS_ADMIN_EMAIL
        sync: false
      - key: SAAS_ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_PROVIDER
        value: aba_payway
      - key: ABA_PAYWAY_ENV
        value: sandbox
      - key: ABA_PAYWAY_MERCHANT_ID
        sync: false
      - key: ABA_PAYWAY_API_KEY
        sync: false
      - key: ABA_PAYWAY_RSA_PRIVATE_KEY
        sync: false
      - key: ABA_PAYWAY_API_BASE_URL
        value: https://checkout-sandbox.payway.com.kh
      - key: ABA_PAYWAY_CHECKOUT_URL
        value: https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/purchase
      - key: ABA_PAYWAY_CALLBACK_URL
        sync: false
      - key: ABA_PAYWAY_RETURN_URL
        sync: false
      - key: PAYMENT_DEFAULT_CURRENCY
        value: USD

databases:
  - name: taikry-market-database
    databaseName: taikry_market
    user: taikry_app
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
