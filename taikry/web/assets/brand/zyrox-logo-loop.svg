<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none" role="img" aria-label="ZYROX AI Seamless Animated Logo">
  <defs>
    <!-- Seamless Sweeping Gradient for Z Stroke -->
    <linearGradient id="zyroxSweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D99A" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#00D99A" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#16E6AB" stop-opacity="1"/>
      <stop offset="65%" stop-color="#00D99A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00D99A" stop-opacity="0.3"/>
      <animate attributeName="x1" values="-100%;100%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Metallic Wordmark Shimmer -->
    <linearGradient id="zyroxWordmarkShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAFFF5"/>
      <stop offset="42%" stop-color="#EAFFF5"/>
      <stop offset="50%" stop-color="#16E6AB"/>
      <stop offset="58%" stop-color="#EAFFF5"/>
      <stop offset="100%" stop-color="#EAFFF5"/>
      <animate attributeName="x1" values="-150%;150%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-50%;250%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="shieldFillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102019"/>
      <stop offset="100%" stop-color="#060B09"/>
    </linearGradient>

    <!-- Emerald Soft Glow Filter -->
    <filter id="emeraldSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes shieldBreathing {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 3px rgba(0, 217, 154, 0.25));
        }
        50% {
          transform: scale(1.02);
          filter: drop-shadow(0 0 8px rgba(22, 230, 171, 0.55));
        }
      }
      @keyframes coreNexusPulse {
        0%, 100% {
          opacity: 0.75;
          r: 3.2px;
        }
        50% {
          opacity: 1;
          r: 4.2px;
        }
      }
      @keyframes haloBreathing {
        0%, 100% {
          opacity: 0.2;
          r: 5.5px;
        }
        50% {
          opacity: 0.45;
          r: 7.5px;
        }
      }
      @keyframes tagPulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      .shield-interactive-group {
        transform-origin: 32px 32px;
        animation: shieldBreathing 4.5s ease-in-out infinite;
      }
      .nexus-core {
        animation: coreNexusPulse 4.5s ease-in-out infinite;
      }
      .nexus-halo {
        animation: haloBreathing 4.5s ease-in-out infinite;
      }
      .tagline-pulse {
        animation: tagPulse 4.5s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .shield-interactive-group, .nexus-core, .nexus-halo, .tagline-pulse {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Left Monogram: Geometric Z Shield (48x48) -->
  <g class="shield-interactive-group" transform="translate(4, 4)">
    <!-- Outer Hex Shield -->
    <polygon points="28,4 50,14 50,42 28,52 6,42 6,14" fill="url(#shieldFillGrad)" stroke="#20372C" stroke-width="1.8"/>
    <!-- Subtle Inner Inset Bevel -->
    <polygon points="28,7 47,16 47,40 28,49 9,40 9,16" fill="none" stroke="#00D99A" stroke-opacity="0.25" stroke-width="1"/>
    
    <!-- Dynamic Glowing Z Monogram -->
    <path d="M16 18 H40 L16 38 H40" fill="none" stroke="url(#zyroxSweepGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#emeraldSoftGlow)"/>
    <!-- Sharp Core Filament -->
    <path d="M16 18 H40 L16 38 H40" fill="none" stroke="#EAFFF5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
    
    <!-- Neural Quantum Core -->
    <circle cx="28" cy="28" r="6" fill="#16E6AB" class="nexus-halo"/>
    <circle cx="28" cy="28" r="3.2" fill="#16E6AB" class="nexus-core"/>
  </g>

  <!-- Right Typography: ZYROX AI Wordmark -->
  <text x="68" y="36" font-family="'JetBrains Mono', 'Inter', -apple-system, sans-serif" font-size="23" font-weight="900" letter-spacing="3" fill="url(#zyroxWordmarkShimmer)">
    ZYROX
  </text>
  
  <!-- AI Badge Pill -->
  <g transform="translate(182, 19)">
    <rect width="36" height="20" rx="4" fill="rgba(0, 217, 154, 0.12)" stroke="#00D99A" stroke-width="1"/>
    <text x="18" y="14.5" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#00D99A" letter-spacing="1.5" text-anchor="middle">
      AI
    </text>
  </g>

  <!-- Institutional Tagline -->
  <text x="70" y="52" font-family="'Inter', -apple-system, sans-serif" font-size="8.2" font-weight="600" letter-spacing="2" fill="#87A99A" class="tagline-pulse">
    READ THE MARKET. OWN YOUR EDGE.
  </text>
</svg>

