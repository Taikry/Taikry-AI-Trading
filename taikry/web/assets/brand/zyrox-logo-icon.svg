<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="ZYROX AI Icon">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="iconBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#102019"/>
      <stop offset="70%" stop-color="#0B1511"/>
      <stop offset="100%" stop-color="#060B09"/>
    </radialGradient>

    <!-- Emerald Monogram Stroke -->
    <linearGradient id="iconEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16E6AB"/>
      <stop offset="50%" stop-color="#00D99A"/>
      <stop offset="100%" stop-color="#00A875"/>
    </linearGradient>

    <filter id="iconSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes iconGlowPulse {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 217, 154, 0.3)); }
        50% { filter: drop-shadow(0 0 24px rgba(22, 230, 171, 0.65)); }
      }
      .icon-shield-inner {
        animation: iconGlowPulse 4.5s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .icon-shield-inner { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background Base Container with Rounded Corners (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#iconBgGlow)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" stroke="#20372C" stroke-width="8"/>

  <!-- Inner Ambient Aura -->
  <circle cx="256" cy="256" r="180" fill="#00D99A" fill-opacity="0.06" filter="url(#iconSoftGlow)"/>

  <!-- Precision Shield Geometry -->
  <g class="icon-shield-inner">
    <!-- Outer Shield Boundary -->
    <polygon points="256,64 424,144 424,368 256,448 88,368 88,144" fill="#0B1511" stroke="#20372C" stroke-width="12"/>
    <polygon points="256,88 396,156 396,352 256,420 116,352 116,156" fill="none" stroke="#00D99A" stroke-opacity="0.2" stroke-width="6"/>

    <!-- High-Impact Z Monogram -->
    <path d="M168 184 H344 L168 328 H344" fill="none" stroke="url(#iconEmeraldGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconSoftGlow)"/>
    <path d="M168 184 H344 L168 328 H344" fill="none" stroke="#EAFFF5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>

    <!-- Neural Nexus Core -->
    <circle cx="256" cy="256" r="48" fill="#00D99A" fill-opacity="0.25"/>
    <circle cx="256" cy="256" r="28" fill="#16E6AB"/>
    <circle cx="256" cy="256" r="12" fill="#EAFFF5"/>
  </g>
</svg>

