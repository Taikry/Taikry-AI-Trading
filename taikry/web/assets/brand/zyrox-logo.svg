<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none" role="img" aria-label="ZYROX AI Logo">
  <defs>
    <!-- Emerald Brand Gradients -->
    <linearGradient id="zyroxZGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16E6AB"/>
      <stop offset="100%" stop-color="#00D99A"/>
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102019"/>
      <stop offset="100%" stop-color="#060B09"/>
    </linearGradient>
  </defs>

  <!-- Left Monogram: Geometric Z Shield (48x48, centered in 64x64) -->
  <g transform="translate(4, 4)">
    <!-- Outer Hex Shield -->
    <polygon points="28,4 50,14 50,42 28,52 6,42 6,14" fill="url(#shieldBg)" stroke="#20372C" stroke-width="1.8"/>
    <!-- Subtle Inner Inset Bevel -->
    <polygon points="28,7 47,16 47,40 28,49 9,40 9,16" fill="none" stroke="#00D99A" stroke-opacity="0.2" stroke-width="1"/>
    
    <!-- Precision Z Monogram -->
    <path d="M16 18 H40 L16 38 H40" fill="none" stroke="url(#zyroxZGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Secondary Highlight Filament -->
    <path d="M19 18 H38" fill="none" stroke="#EAFFF5" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Neural Quantum Core -->
    <circle cx="28" cy="28" r="3.2" fill="#16E6AB"/>
    <circle cx="28" cy="28" r="6" fill="#00D99A" fill-opacity="0.25"/>
  </g>

  <!-- Right Typography: ZYROX AI Wordmark -->
  <text x="68" y="36" font-family="'JetBrains Mono', 'Inter', -apple-system, sans-serif" font-size="23" font-weight="900" letter-spacing="3" fill="#EAFFF5">
    ZYROX
  </text>
  
  <!-- AI Badge Pill -->
  <g transform="translate(182, 19)">
    <rect width="36" height="20" rx="4" fill="rgba(0, 217, 154, 0.12)" stroke="#00D99A" stroke-width="1"/>
    <text x="18" y="14.5" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#00D99A" letter-spacing="1.5" text-anchor="middle">
      AI
    </text>
  </g>

  <!-- Institutional Tagline -->
  <text x="70" y="52" font-family="'Inter', -apple-system, sans-serif" font-size="8.2" font-weight="600" letter-spacing="2" fill="#87A99A">
    READ THE MARKET. OWN YOUR EDGE.
  </text>
</svg>
